[package]
name = "glory-agent"
version = "0.1.0"
edition = "2021"
description = "Glory Agent — chat realtime + IA reutilizable (Axum + SQLx + providers OpenAI-compat)"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
dashmap = "6"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
dotenvy = "0.15"
